# Exemplo de configuração Kubernetes para Evolution API com health checks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evolution-api
  labels:
    app: evolution-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: evolution-api
  template:
    metadata:
      labels:
        app: evolution-api
    spec:
      containers:
      - name: evolution-api
        image: evolution-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              name: evolution-api-secrets
              key: database-uri
        - name: REDIS_URI
          valueFrom:
            secretKeyRef:
              name: evolution-api-secrets
              key: redis-uri
        - name: NODE_ENV
          value: "production"
        
        # Configuração dos Health Checks
        # Startup Probe - verifica se a aplicação iniciou corretamente
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10    # Aguarda 10s antes da primeira verificação
          periodSeconds: 5           # Verifica a cada 5s
          timeoutSeconds: 3          # Timeout de 3s por verificação
          failureThreshold: 30       # Permite 30 falhas (150s total para startup)
          successThreshold: 1        # Uma verificação bem-sucedida é suficiente
        
        # Liveness Probe - verifica se a aplicação está rodando
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30    # Aguarda 30s após startup
          periodSeconds: 30          # Verifica a cada 30s
          timeoutSeconds: 5          # Timeout de 5s por verificação
          failureThreshold: 3        # 3 falhas consecutivas reinicia o pod
          successThreshold: 1        # Uma verificação bem-sucedida é suficiente
        
        # Readiness Probe - verifica se a aplicação está pronta para receber tráfego
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5     # Aguarda 5s após startup
          periodSeconds: 10          # Verifica a cada 10s
          timeoutSeconds: 3          # Timeout de 3s por verificação
          failureThreshold: 3        # 3 falhas consecutivas remove do serviço
          successThreshold: 1        # Uma verificação bem-sucedida é suficiente
        
        # Configuração de recursos
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Configuração de segurança
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false

---
apiVersion: v1
kind: Service
metadata:
  name: evolution-api-service
  labels:
    app: evolution-api
spec:
  selector:
    app: evolution-api
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP

---
# Secret para variáveis sensíveis
apiVersion: v1
kind: Secret
metadata:
  name: evolution-api-secrets
type: Opaque
data:
  # Base64 encoded values
  # echo -n "postgresql://user:password@host:5432/database" | base64
  database-uri: cG9zdGdyZXNxbDovL3VzZXI6cGFzc3dvcmRAaG9zdDo1NDMyL2RhdGFiYXNl
  # echo -n "redis://redis-host:6379" | base64  
  redis-uri: cmVkaXM6Ly9yZWRpcy1ob3N0OjYzNzk=

---
# HorizontalPodAutoscaler para escalabilidade automática
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: evolution-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: evolution-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max

---
# PodDisruptionBudget para alta disponibilidade
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: evolution-api-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: evolution-api
